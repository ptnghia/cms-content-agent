name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check
      - run: npm test   # includes the plugin <-> backend token test (php is preinstalled on ubuntu-latest)

  plugin:
    name: WordPress plugin (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
      - name: php -l
        run: npm run lint:php
      - name: Build plugin zip
        if: matrix.php == '8.3'
        run: npm run build:wp
      - uses: actions/upload-artifact@v7
        if: matrix.php == '8.3'
        with:
          name: content-agent-plugin
          path: dist/content-agent.zip

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build --build-arg INSTALL_CLAUDE=0 -t cms-content-agent:ci .
      - name: Start and probe /api/health
        run: |
          printf '{"main":{"name":"CI","tokenSecret":"%s","allowedOrigins":[]}}' "$(openssl rand -hex 32)" > sites.json
          docker run -d --name cca -p 3000:3000 -v "$PWD/sites.json:/app/config/sites.json:ro" cms-content-agent:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:3000/api/health && exit 0; sleep 1; done
          docker logs cca; exit 1
