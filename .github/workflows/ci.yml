name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check
      - run: npm test   # includes the PHP <-> Node token test (php is preinstalled on ubuntu-latest)
      - name: Lint PHP helpers
        run: for f in php/*.php; do php -l "$f"; done

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --build-arg INSTALL_CLAUDE=0 -t cms-content-agent:ci .
      - name: Start and probe /api/health
        run: |
          printf '{"main":{"name":"CI","tokenSecret":"%s","allowedOrigins":[]}}' "$(openssl rand -hex 32)" > sites.json
          docker run -d --name cca -p 3000:3000 -v "$PWD/sites.json:/app/config/sites.json:ro" cms-content-agent:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:3000/api/health && exit 0; sleep 1; done
          docker logs cca; exit 1
