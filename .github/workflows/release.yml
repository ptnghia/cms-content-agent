name: Release

# Push a tag like v0.4.0 to publish a GitHub release with the WordPress plugin zip attached.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: npm test
      - run: npm run lint:php
      - run: npm run build:wp
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/content-agent.zip dist/content-agent-*.zip \
            --title "$GITHUB_REF_NAME" --generate-notes
